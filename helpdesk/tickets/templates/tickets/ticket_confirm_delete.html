{% extends 'base.html' %}
{% block title %}Delete Ticket{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white fw-semibold">
        <i class="fa fa-trash me-2"></i>Delete Ticket
      </div>
      <div class="card-body text-center py-4">
        <i class="fa fa-exclamation-triangle fa-3x text-danger mb-3"></i>
        <p class="lead">Delete ticket <strong>{{ ticket.ticket_id }}</strong>?</p>
        <p class="text-muted">{{ ticket.title }}</p>
        <p class="small text-muted">This will permanently remove the ticket and all comments.</p>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-danger me-2" type="submit">
            <i class="fa fa-trash me-1"></i>Yes, Delete
          </button>
          <a href="{% url 'ticket_detail' ticket.ticket_id %}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
