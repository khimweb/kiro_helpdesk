{% extends 'base.html' %}
{% block title %}{{ action }} Category{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">
        <i class="fa fa-tag me-2 text-primary"></i>{{ action }} Category
      </div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label fw-semibold">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small">{{ field.errors.as_text }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit"><i class="fa fa-save me-1"></i>Save</button>
            <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
