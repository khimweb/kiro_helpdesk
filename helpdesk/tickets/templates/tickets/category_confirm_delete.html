{% extends 'base.html' %}
{% block title %}Delete Category{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white fw-semibold">Delete Category</div>
      <div class="card-body text-center py-4">
        <i class="fa fa-exclamation-triangle fa-3x text-danger mb-3"></i>
        <p class="lead">Delete category <strong>{{ category.name }}</strong>?</p>
        <p class="small text-muted">Existing tickets in this category will have their category set to null.</p>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-danger me-2" type="submit">Delete</button>
          <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
