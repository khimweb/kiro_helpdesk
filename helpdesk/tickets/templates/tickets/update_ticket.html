{% extends 'base.html' %}
{% block title %}Update Ticket{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between">
        <span class="fw-semibold">
          <i class="fa fa-edit me-2 text-warning"></i>Update Ticket
        </span>
        <code>{{ ticket.ticket_id }}</code>
      </div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label fw-semibold">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small">{{ field.errors.as_text }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <div class="d-flex gap-2">
            <button class="btn btn-warning" type="submit">
              <i class="fa fa-save me-1"></i>Save Changes
            </button>
            <a href="{% url 'ticket_detail' ticket.ticket_id %}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
