{% extends 'base.html' %}
{% block title %}Delete User{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white fw-semibold">
        <i class="fa fa-trash me-2"></i>Delete User
      </div>
      <div class="card-body text-center py-4">
        <i class="fa fa-exclamation-triangle fa-3x text-danger mb-3"></i>
        <p class="lead">Are you sure you want to delete <strong>{{ target_user.username }}</strong>?</p>
        <p class="text-muted small">This action cannot be undone.</p>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-danger me-2" type="submit"><i class="fa fa-trash me-1"></i>Delete</button>
          <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
